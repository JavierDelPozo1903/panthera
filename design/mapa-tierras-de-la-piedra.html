<style>

.acts button { width: auto; padding: 0 12px; font: 500 13px/1 var(--body); letter-spacing: .02em; }

.fact { background: #2a2016; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; display: grid; gap: 3px; }
.fact b { font: 500 16px/1 var(--mono); font-variant-numeric: tabular-nums; }
.fact span { font: 500 10px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.block { display: grid; gap: 8px; }

// tipo: boss, altar, quest, secret, den
const POIS = [

  { t: 'altar', x: 760, y: 610, n: 'Altar del kopje', d: 'Primer altar de Kito' },

  { t: 'boss', x: 1210, y: 300, n: 'El Guardián de la Niebla', d: 'Embestidas que rompen el escenario' },

  { t: 'boss', x: 1170, y: 910, n: 'La Leona de Sal', d: 'Espejismos de Nuru y Amara' },

const KINDS = {
  boss: { label: 'Jefes', color: '#8e2b1e' },
  altar: { label: 'Altares de Kito (guardar y subir de nivel)', color: '#3e8f4e' },
  quest: { label: 'Misiones secundarias', color: '#2c4f7a' },
  secret: { label: 'Secretos y coleccionables', color: '#8a6a1c' },
  den: { label: 'Guaridas y lugares de la historia', color: '#3a2816' },
};
const show = { boss: true, altar: true, quest: true, secret: true, den: true };
let act = 3;
let selected = 'savanna';

/* ------------------------------------------------------------------ ruido */
function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }

const coastX = (y) => 150 + 70 * fbm(y * 0.006, 3.3, 4) + 40 * Math.sin(y * 0.004);
const region = (id) => REGIONS.find((r) => r.id === id);

/* ------------------------------------------------------------------ pintura base (una vez) */
const base = document.createElement('canvas');
base.width = W; base.height = H;
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function paintBase() {
  const g = base.getContext('2d');
  const img = g.createImageData(W, H);
  const P = hexRgb('#eadbbb');
  const SEA = hexRgb('#9fb3ad');
  const elev = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let e = fbm(x * 0.004, y * 0.004, 5);
    const m = region('mountains'), c = region('crater');
    e += 0.55 * Math.exp(-((x - m.x) ** 2 + (y - m.y) ** 2) / (2 * 190 ** 2));
    const dc = Math.hypot(x - c.x, y - c.y);
    e += 0.35 * Math.exp(-((dc - 120) ** 2) / (2 * 35 ** 2)) - 0.2 * Math.exp(-(dc ** 2) / (2 * 70 ** 2));
    const ct = region('citadel');
    const dz = Math.hypot(x - ct.x, y - ct.y);
    e += 0.18 * Math.exp(-((dz - 70) ** 2) / (2 * 18 ** 2)) - 0.12 * Math.exp(-(dz ** 2) / (2 * 40 ** 2));
    elev[y * W + x] = e;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    const e = elev[y * W + x];
    const land = x > coastX(y);
    let col;
    if (!land) {
      const d = coastX(y) - x;
      const k = Math.min(1, d / 120);
      col = SEA.map((s, j) => s * (0.85 + 0.15 * k) + (P[j] - s) * (1 - k) * 0.35);
      if (Math.sin(d * 0.35) > 0.85 && d < 90) col = col.map((c) => c * 0.88); // líneas de costa
    } else {
      let r = 0, gg = 0, b = 0, ws = 0;
      for (const R of REGIONS) {
        const d2 = (x - R.x) ** 2 + (y - R.y) ** 2;
        const w = Math.exp(-d2 / (2 * (R.r * 0.85) ** 2));
        const c = hexRgb(R.biome);
        r += c[0] * w; gg += c[1] * w; b += c[2] * w; ws += w;
      }
      const wb = 0.25;
      const bc = hexRgb('#cdb98a');
      r = (r + bc[0] * wb) / (ws + wb); gg = (gg + bc[1] * wb) / (ws + wb); b = (b + bc[2] * wb) / (ws + wb);
      // acuarela: mezcla con el papel
      const wash = 0.55 + 0.25 * fbm(x * 0.02, y * 0.02, 3);
      col = [P[0] + (r - P[0]) * wash, P[1] + (gg - P[1]) * wash, P[2] + (b - P[2]) * wash];
      // sombreado del relieve
      const ex = (elev[y * W + Math.min(W - 1, x + 1)] - elev[y * W + Math.max(0, x - 1)]);
      const ey = (elev[Math.min(H - 1, y + 1) * W + x] - elev[Math.max(0, y - 1) * W + x]);
      const shade = Math.max(-0.25, Math.min(0.25, (-ex - ey) * 18));
      col = col.map((c) => c * (1 + shade * 0.6));
      // curvas de nivel
      const lv = e * 14;
      if (Math.abs(lv - Math.round(lv)) < 0.035 && e > 0.55) col = col.map((c) => c * 0.86);
    }
    // grano de papel y viñeta
    const gr = 0.94 + 0.08 * hash(x * 7 + 3, y * 13 + 1);
    const vx = x / W - 0.5, vy = y / H - 0.5;
    const vig = 1 - 0.55 * Math.max(0, Math.hypot(vx * 1.1, vy * 1.3) - 0.38);
    img.data[i] = col[0] * gr * vig; img.data[i + 1] = col[1] * gr * vig; img.data[i + 2] = col[2] * gr * vig; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);

  // ríos
  g.lineCap = 'round'; g.lineJoin = 'round';
  const river = (pts, w) => {
    g.strokeStyle = 'rgba(70,104,112,.85)'; g.lineWidth = w;
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); }
    const l = pts[pts.length - 1]; g.lineTo(l[0], l[1]); g.stroke();
  };
  river([[1380, 520], [1250, 580], [1100, 640], [950, 700], [820, 720], [700, 600], [600, 470], [480, 360], [370, 300], [260, 290]], 5);
  river([[880, 280], [780, 300], [650, 290], [520, 320], [430, 330]], 3.5);
  river([[1200, 320], [1150, 420], [1120, 520], [1100, 640]], 2.5);
  river([[560, 420], [480, 470], [350, 520], [250, 560]], 2.5);
  // canales del delta
  for (let i = 0; i < 26; i++) {
    const a = hash(i, 9) * Math.PI * 2, rr = 40 + hash(i, 4) * 150;
    const x = 430 + Math.cos(a) * rr, y = 330 + Math.sin(a) * rr * 0.7;
    river([[x, y], [x - 20 - hash(i, 2) * 30, y + 10], [x - 50, y + hash(i, 1) * 30 - 10]], 1.4);
  }
  // lago del cráter y lago de sal
  g.fillStyle = 'rgba(80,110,118,.75)'; g.beginPath(); g.ellipse(1205, 305, 48, 32, 0.2, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(250,247,240,.7)'; g.beginPath(); g.ellipse(1165, 905, 150, 90, -0.15, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(120,110,95,.35)'; g.lineWidth = 1;
  for (let i = 0; i < 40; i++) { const a = hash(i, 77) * 6.28, rr = hash(i, 78) * 130; g.beginPath(); g.moveTo(1165 + Math.cos(a) * rr, 905 + Math.sin(a) * rr * 0.6); g.lineTo(1165 + Math.cos(a + 0.4) * rr * 1.1, 905 + Math.sin(a + 0.4) * rr * 0.66); g.stroke(); }
  // la Ciudadela: cráter del meteorito
  g.strokeStyle = 'rgba(58,40,22,.6)'; g.lineWidth = 2; g.beginPath(); g.arc(960, 455, 70, 0, Math.PI * 2); g.stroke();

  // glifos de cartógrafo
  const ink = 'rgba(58,40,22,';
  const rnd = (i, s) => hash(i * 31 + s, i * 17 + s * 3);
  // montañas
  for (let i = 0; i < 70; i++) {
    const a = rnd(i, 1) * 6.28, rr = Math.sqrt(rnd(i, 2)) * 210;
    const x = 1400 + Math.cos(a) * rr, y = 600 + Math.sin(a) * rr * 1.1;
    const s = 12 + rnd(i, 3) * 16;
    g.fillStyle = 'rgba(234,219,187,.75)';
    g.beginPath(); g.moveTo(x - s, y); g.lineTo(x, y - s * 1.3); g.lineTo(x + s, y); g.closePath(); g.fill();
    g.strokeStyle = ink + '.8)'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(x - s, y); g.lineTo(x, y - s * 1.3); g.lineTo(x + s, y); g.stroke();
    g.lineWidth = 0.8; for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x + k * s * 0.18, y - s * 1.3 + k * s * 0.28); g.lineTo(x + k * s * 0.3, y); g.stroke(); }
    if (s > 20) { g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.moveTo(x - s * 0.25, y - s * 1.0); g.lineTo(x, y - s * 1.3); g.lineTo(x + s * 0.25, y - s * 1.0); g.closePath(); g.fill(); }
  }
  // borde del cráter
  for (let i = 0; i < 46; i++) {
    const a = (i / 46) * 6.28; const x = 1200 + Math.cos(a) * 125, y = 300 + Math.sin(a) * 115; const s = 9 + rnd(i, 5) * 6;
    g.strokeStyle = ink + '.7)'; g.lineWidth = 1.1; g.beginPath(); g.moveTo(x - s, y); g.lineTo(x, y - s); g.lineTo(x + s, y); g.stroke();
  }
  // árboles de la selva
  for (let i = 0; i < 420; i++) {
    const a = rnd(i, 7) * 6.28, rr = Math.sqrt(rnd(i, 8)) * 230;
    const x = 820 + Math.cos(a) * rr * 1.2, y = 190 + Math.sin(a) * rr * 0.75;
    if (x < coastX(y) + 20) continue;
    const s = 4 + rnd(i, 9) * 5;
    g.fillStyle = `rgba(${50 + rnd(i, 10) * 30},${85 + rnd(i, 11) * 30},52,.85)`;
    g.beginPath(); g.arc(x, y, s, 0, 6.28); g.fill();
    g.strokeStyle = ink + '.55)'; g.lineWidth = 0.7; g.stroke();
  }
  // acacias de la sabana
  for (let i = 0; i < 110; i++) {
    const a = rnd(i, 12) * 6.28, rr = Math.sqrt(rnd(i, 13)) * 260;
    const x = 760 + Math.cos(a) * rr * 1.2, y = 650 + Math.sin(a) * rr * 0.75;
    g.strokeStyle = ink + '.7)'; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 7); g.stroke();
    g.fillStyle = 'rgba(96,110,60,.8)'; g.beginPath(); g.ellipse(x, y - 8, 8, 2.6, 0, 0, 6.28); g.fill(); g.stroke();
  }
  // hierba
  g.strokeStyle = ink + '.35)'; g.lineWidth = 0.7;
  for (let i = 0; i < 900; i++) {
    const x = 500 + rnd(i, 14) * 650, y = 480 + rnd(i, 15) * 420;
    if (Math.hypot((x - 760) / 1.3, y - 650) > 250) continue;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 5); g.moveTo(x + 2, y); g.lineTo(x + 3, y - 5); g.stroke();
  }
  // kopjes
  for (const [x, y, s] of [[760, 600, 22], [600, 690, 14], [880, 600, 12], [690, 560, 10], [560, 740, 12]]) {
    g.fillStyle = 'rgba(160,140,110,.9)'; g.beginPath(); g.ellipse(x, y, s, s * 0.6, 0, 3.14, 6.28); g.fill();
    g.strokeStyle = ink + '.8)'; g.lineWidth = 1.2; g.stroke();
  }
  // dunas
  g.strokeStyle = 'rgba(140,80,40,.5)'; g.lineWidth = 1.2;
  for (let i = 0; i < 90; i++) {
    const a = rnd(i, 16) * 6.28, rr = Math.sqrt(rnd(i, 17)) * 220;
    const x = 420 + Math.cos(a) * rr, y = 830 + Math.sin(a) * rr * 0.8;
    if (x < coastX(y) + 30) continue;
    g.beginPath(); g.arc(x, y + 12, 16, 3.6, 5.8); g.stroke();
  }
  // mina de los Voss
  g.strokeStyle = 'rgba(60,140,70,.7)'; g.lineWidth = 2;
  for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(450, 860, 46 - k * 10, 28 - k * 6, 0, 0, 6.28); g.stroke(); }
  // juncos del delta
  g.strokeStyle = 'rgba(60,90,50,.6)'; g.lineWidth = 0.8;
  for (let i = 0; i < 260; i++) {
    const a = rnd(i, 18) * 6.28, rr = Math.sqrt(rnd(i, 19)) * 190;
    const x = 430 + Math.cos(a) * rr, y = 330 + Math.sin(a) * rr * 0.75;
    if (x < coastX(y) + 10) continue;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 1, y - 6); g.moveTo(x + 2, y); g.lineTo(x + 3, y - 5); g.stroke();
  }
  // olas del mar
  g.strokeStyle = 'rgba(58,80,86,.35)'; g.lineWidth = 1;
  for (let i = 0; i < 70; i++) {
    const y = rnd(i, 20) * H, x = coastX(y) - 30 - rnd(i, 21) * 110;
    if (x < 10) continue;
    g.beginPath(); g.arc(x, y, 6, 3.6, 5.8); g.arc(x + 11, y, 6, 3.6, 5.8); g.stroke();
  }

  // caminos entre regiones
  g.setLineDash([2, 7]); g.strokeStyle = 'rgba(90,50,25,.75)'; g.lineWidth = 2;
  const road = (a, b, bend = 0) => { const A = region(a), B = region(b); g.beginPath(); g.moveTo(A.x, A.y); g.quadraticCurveTo((A.x + B.x) / 2 + bend, (A.y + B.y) / 2 - bend * 0.6, B.x, B.y); g.stroke(); };
  road('savanna', 'citadel', 30); road('savanna', 'delta', -60); road('savanna', 'kalahari', 40); road('citadel', 'congo', 20);
  road('congo', 'crater', -40); road('crater', 'mountains', 50); road('savanna', 'saltlake', -50); road('mountains', 'saltlake', 40); road('delta', 'congo', 60); road('delta', 'coast', 0);
  g.setLineDash([]);

  // rosa de los vientos
  const rx = 1480, ry = 160;
  g.save(); g.translate(rx, ry);
  g.strokeStyle = ink + '.85)'; g.fillStyle = ink + '.85)'; g.lineWidth = 1.2;
  g.beginPath(); g.arc(0, 0, 54, 0, 6.28); g.stroke(); g.beginPath(); g.arc(0, 0, 48, 0, 6.28); g.stroke();
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, L = k % 2 ? 34 : 62;
    g.save(); g.rotate(a);
    g.beginPath(); g.moveTo(0, -L); g.lineTo(6, 0); g.lineTo(0, 0); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(0, -L); g.lineTo(-6, 0); g.lineTo(0, 0); g.closePath(); g.stroke();
    g.restore();
  }
  g.font = '22px "IM Fell English SC", Georgia, serif'; g.textAlign = 'center'; g.fillText('N', 0, -70);
  g.restore();

  // cartela
  g.save();
  g.translate(140, 1000);
  g.fillStyle = 'rgba(234,219,187,.92)'; g.strokeStyle = ink + '.85)'; g.lineWidth = 1.5;
  g.fillRect(-10, -55, 420, 100); g.strokeRect(-10, -55, 420, 100); g.strokeRect(-4, -49, 408, 88);
  g.fillStyle = ink + '.95)'; g.textAlign = 'left';
  g.font = '30px "IM Fell English SC", Georgia, serif'; g.fillText('Tierras de la Piedra', 8, -16);
  g.font = 'italic 16px "IM Fell English", Georgia, serif'; g.fillText('Levantado por la Compañía Real de Marfil y Curiosidades', 8, 8);
  g.fillText('Año de 1891 · Escala en kilómetros', 8, 28);
  g.restore();
  // escala
  g.save(); g.translate(1250, 1040);
  g.fillStyle = ink + '.9)'; g.strokeStyle = ink + '.9)'; g.lineWidth = 1.2;
  for (let k = 0; k < 4; k++) { if (k % 2 === 0) g.fillRect(k * KM / 2, 0, KM / 2, 8); g.strokeRect(k * KM / 2, 0, KM / 2, 8); }
  g.font = '14px "IM Fell English", Georgia, serif'; g.textAlign = 'center';
  for (let k = 0; k <= 2; k++) g.fillText(`${k} km`, k * KM, 26);
  g.restore();
}

/* ------------------------------------------------------------------ iconos */
function icon(g, t, x, y, s = 1, alpha = 1) {
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha = alpha;
  const K = KINDS[t].color;
  g.lineWidth = 1.6; g.strokeStyle = '#2a1c0e';
  if (t === 'boss') {
    g.fillStyle = K; g.beginPath(); g.arc(0, 0, 11, 0, 6.28); g.fill(); g.stroke();
    g.fillStyle = '#f3e7cf';
    g.beginPath(); g.ellipse(0, -1.5, 6, 5.5, 0, 0, 6.28); g.fill();
    g.fillRect(-3.6, 2.5, 7.2, 3.6);
    g.fillStyle = K; g.beginPath(); g.arc(-2.3, -1.5, 1.6, 0, 6.28); g.arc(2.3, -1.5, 1.6, 0, 6.28); g.fill();
  } else if (t === 'altar') {
    g.fillStyle = '#e9dcc0'; g.beginPath(); g.moveTo(-9, 9); g.lineTo(9, 9); g.lineTo(6, -2); g.lineTo(-6, -2); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = K; g.beginPath(); g.moveTo(0, -12); g.quadraticCurveTo(6, -6, 0, -2); g.quadraticCurveTo(-6, -6, 0, -12); g.fill(); g.stroke();
  } else if (t === 'quest') {
    g.fillStyle = '#f0e4c8'; g.beginPath(); g.rect(-8, -9, 16, 18); g.fill(); g.stroke();
    g.strokeStyle = K; g.lineWidth = 1.4; for (const yy of [-4, 0, 4]) { g.beginPath(); g.moveTo(-5, yy); g.lineTo(5, yy); g.stroke(); }
  } else if (t === 'secret') {
    g.fillStyle = '#d9b24a'; g.beginPath();
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 4.5 : 11; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    g.closePath(); g.fill(); g.stroke();
  } else if (t === 'den') {
    g.fillStyle = '#e9dcc0'; g.beginPath(); g.moveTo(-10, 8); g.quadraticCurveTo(0, -16, 10, 8); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#2a1c0e'; g.beginPath(); g.moveTo(-4, 8); g.quadraticCurveTo(0, -3, 4, 8); g.closePath(); g.fill();
  }
  g.restore();
}

/* ------------------------------------------------------------------ vista */
const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
const view = { x: W / 2, y: H / 2, z: 1, min: 0.4, max: 4 };
let dpr = Math.min(2, devicePixelRatio || 1);

function fit() {
  const r = cv.getBoundingClientRect();
  view.z = Math.min(r.width / W, r.height / H) * 0.98;
  view.min = view.z * 0.9; view.max = view.z * 5;
  view.x = W / 2; view.y = H / 2;
}
function resize() {
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  if (!resize.done) { fit(); resize.done = true; }
  draw();
}
const toScreen = (x, y) => { const r = cv.getBoundingClientRect(); return [(x - view.x) * view.z + r.width / 2, (y - view.y) * view.z + r.height / 2]; };
const toWorld = (sx, sy) => { const r = cv.getBoundingClientRect(); return [(sx - r.width / 2) / view.z + view.x, (sy - r.height / 2) / view.z + view.y]; };

const visibleIn = (R) => act === 3 || R.act <= act && !(act === 0 && R.id !== 'savanna' && R.id !== 'citadel') && R.id !== 'coast';

function draw() {
  const r = cv.getBoundingClientRect();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.save();
  ctx.translate(r.width / 2, r.height / 2); ctx.scale(view.z, view.z); ctx.translate(-view.x, -view.y);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30;
  ctx.drawImage(base, 0, 0);
  ctx.shadowBlur = 0;

  // niebla sobre lo que aún no se puede explorar
  for (const R of REGIONS) {
    if (visibleIn(R)) continue;
    const gr = ctx.createRadialGradient(R.x, R.y, R.r * 0.2, R.x, R.y, R.r * 1.1);
    gr.addColorStop(0, 'rgba(236,230,214,.93)'); gr.addColorStop(1, 'rgba(236,230,214,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(R.x, R.y, R.r * 1.1, 0, 6.28); ctx.fill();
  }

  // región seleccionada
  const S = region(selected);
  ctx.setLineDash([10, 6]); ctx.strokeStyle = 'rgba(79,191,98,.95)'; ctx.lineWidth = 3 / view.z * 1.4;
  ctx.beginPath(); ctx.arc(S.x, S.y, S.r * 0.95, 0, 6.28); ctx.stroke(); ctx.setLineDash([]);

  // iconos
  const s = Math.max(0.8, Math.min(1.6, 1 / view.z * 0.9));
  for (const p of POIS) {
    if (!show[p.t]) continue;
    const R = REGIONS.reduce((a, b) => (Math.hypot(p.x - a.x, p.y - a.y) / a.r < Math.hypot(p.x - b.x, p.y - b.y) / b.r ? a : b));
    if (!visibleIn(R)) continue;
    icon(ctx, p.t, p.x, p.y, s);
    if (view.z > 1.35) {
      ctx.font = `${12 / view.z * 1.15}px "IM Fell English", Georgia, serif`;
      ctx.fillStyle = 'rgba(42,28,14,.95)'; ctx.textAlign = 'left';
      ctx.fillText(p.n, p.x + 14 * s, p.y + 4 / view.z);
    }
  }

  // nombres de las regiones
  for (const R of REGIONS) {
    const fs = Math.max(20, 26 / view.z * 0.8);
    ctx.font = `${fs}px "IM Fell English SC", Georgia, serif`;
    ctx.textAlign = 'center';
    const label = visibleIn(R) ? R.name : '? ? ?';
    const ly = R.y - R.r * 0.62;
    ctx.lineWidth = fs * 0.22; ctx.strokeStyle = 'rgba(234,219,187,.85)'; ctx.strokeText(label, R.x, ly);
    ctx.fillStyle = R.id === selected ? '#1f5a2b' : '#2a1c0e'; ctx.fillText(label, R.x, ly);
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ interacción */
let drag = null, moved = false;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; moved = false; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
cv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  view.x -= dx / view.z; view.y -= dy / view.z; drag = { x: e.clientX, y: e.clientY }; clamp(); draw();
});
cv.addEventListener('pointerup', (e) => {
  cv.classList.remove('drag');
  if (drag && !moved) {
    const rect = cv.getBoundingClientRect();
    const [wx, wy] = toWorld(e.clientX - rect.left, e.clientY - rect.top);
    let best = null, bd = Infinity;
    for (const R of REGIONS) { const d = Math.hypot(wx - R.x, wy - R.y) / R.r; if (d < bd) { bd = d; best = R; } }
    if (best && bd < 1.2) { selected = best.id; renderPanel(); draw(); }
  }
  drag = null;
});
function zoomAt(f, sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  view.z = Math.max(view.min, Math.min(view.max, view.z * f));
  const [nx, ny] = toWorld(sx, sy);
  view.x += wx - nx; view.y += wy - ny; clamp(); draw();
}
cv.addEventListener('wheel', (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
function clamp() { view.x = Math.max(0, Math.min(W, view.x)); view.y = Math.max(0, Math.min(H, view.y)); }
const center = () => { const r = cv.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById('zin').onclick = () => zoomAt(1.3, ...center());
document.getElementById('zout').onclick = () => zoomAt(1 / 1.3, ...center());
document.getElementById('zfit').onclick = () => { fit(); draw(); };
document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
  act = Number(b.dataset.act);
  document.querySelectorAll('[data-act]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  if (!visibleIn(region(selected))) selected = 'savanna';
  renderPanel(); draw();
}));

/* ------------------------------------------------------------------ panel */
const ACT_NAMES = ['Acto I', 'Acto II', 'Acto III', 'Epílogo'];
function renderPanel() {
  const counts = { boss: 0, altar: 0, quest: 0, secret: 0 };
  for (const p of POIS) if (p.t in counts) counts[p.t]++;
  document.getElementById('worldfacts').innerHTML = [
    ['96 km²', 'Superficie'], [REGIONS.length, 'Regiones'], [counts.altar, 'Altares'],
    [counts.boss, 'Jefes'], [counts.quest, 'Misiones'], [counts.secret, 'Secretos'],
  ].map(([v, l]) => `<div class="fact"><b>${v}</b><span>${l}</span></div>`).join('');
  const R = region(selected);
  const near = (p) => REGIONS.reduce((a, b) => (Math.hypot(p.x - a.x, p.y - a.y) / a.r < Math.hypot(p.x - b.x, p.y - b.y) / b.r ? a : b)).id === R.id;
  const list = POIS.filter(near);
  const li = (p) => { const c = document.createElement('canvas'); c.width = c.height = 44; const g = c.getContext('2d'); g.scale(2, 2); icon(g, p.t, 11, 11, 0.85); return `<li><img src="${c.toDataURL()}" width="22" height="22" alt=""><span>${p.n}${p.d ? `<small>${p.d}</small>` : ''}</span></li>`; };
  document.getElementById('region').innerHTML = `
    <div class="block">
      <span class="eyebrow">${ACT_NAMES[R.act]} · ${R.km}</span>
      <h2>${visibleIn(R) ? R.name : 'Región sin explorar'}</h2>
      <p>${visibleIn(R) ? R.feel : 'La niebla de la piedra cubre esta zona hasta más adelante en la historia.'}</p>
    </div>
    ${visibleIn(R) ? `<div class="block"><h3>En la historia</h3><p>${R.story}</p></div>
    <div class="block"><h3>Qué hay aquí</h3><ul class="pois">${list.map(li).join('')}</ul></div>` : ''}`;
}
function renderLegend() {
  const L = document.getElementById('legend');
  for (const [k, v] of Object.entries(KINDS)) {
    const lab = document.createElement('label');
    const c = document.createElement('canvas'); c.width = c.height = 44; const g = c.getContext('2d'); g.scale(2, 2); icon(g, k, 11, 11, 0.85);
    const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = true; inp.id = 'f-' + k;
    inp.addEventListener('change', () => { show[k] = inp.checked; draw(); });
    lab.append(inp, c, document.createTextNode(v.label));
    L.append(lab);
  }
}

document.fonts.ready.then(() => { paintBase(); renderLegend(); renderPanel(); new ResizeObserver(resize).observe(cv); resize(); });
window.mapa = { view, draw, fit, setAct: (a) => document.querySelector(`[data-act="${a}"]`).click(), select: (id) => { selected = id; renderPanel(); draw(); } };
})();
</script>
